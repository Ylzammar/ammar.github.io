<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 404 - Système Introuvable</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #060910;
            color: #00f2fe;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 6rem; margin: 0 0 10px; color: #ef4444; }
        .terminal-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 25px;
            border-radius: 8px;
            max-width: 600px;
            text-align: left;
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.8;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1rem;
            background-color: #00f2fe;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .btn-return {
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-return:hover { background: #00f2fe; }
    </style>
</head>
<body>
    <h1>404</h1>
    <div class="terminal-box">
        <span style="color: #00ff88;">> root@ammar-infra:~#</span> ping page_demandee<br>
        > ping: unknown host page_demandee<br>
        <span style="color: #00ff88;">> root@ammar-infra:~#</span> ERROR: Connexion à la cible perdue.<br>
        <span style="color: #00ff88;">> root@ammar-infra:~#</span> Redirection vers la zone sécurisée... <span class="cursor"></span>
    </div>
    <a href="index.html" class="btn-return">[ Initialiser le retour à l'accueil ]</a>
</body>
</html>
